<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game Simulation</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- CodeMirror Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
</head>
<body>
    <h1>Card Game Simulation</h1>
    <div class="container">
        <p>Enter your JavaScript function for selecting cards and set the number of simulations.</p>

        <label for="playerFunction">Your Strategy Function:</label>
        <textarea id="playerFunction"></textarea>

        <label for="simulations">Number of Simulations:</label>
        <input type="number" id="simulations" value="100000" min="1">

        <button onclick="startSimulation()">Run Game</button>

        <div class="progress-container">
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="progressText">Progress: 0%</p>
        </div>

        <div class="results">
            <h3>Results:</h3>
            <p id="winrate">Winrate: 0%</p>
            <p id="avgGameLength">Avg Dealer Cards: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
